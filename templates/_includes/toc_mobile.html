{% if toc_items %}
<button type="button" class="toc-fab" data-toc-open aria-haspopup="dialog" aria-controls="toc-sheet">
	<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h7"/></svg>Contents
</button>
<div id="toc-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="toc-sheet-title" hidden>
	<button type="button" class="scrim" data-toc-close tabindex="-1" aria-label="Close table of contents"></button>
	<div class="sheet-panel">
		<div class="sheet-head"><p id="toc-sheet-title" class="eyebrow">On this page</p><button type="button" class="icon-btn" data-toc-close aria-label="Close table of contents">✕</button></div>
		<nav>{% for item in toc_items %}<a href="#{{ item.anchor }}" data-toc-link class="toc-item toc-l{{ item.level }}">{{ item.title }}</a>{% endfor %}</nav>
	</div>
</div>
{% endif %}
