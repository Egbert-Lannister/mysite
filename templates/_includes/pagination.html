{% comment %}Shared pagination. Context: posts (Page).{% endcomment %}
{% if posts.has_other_pages %}
<nav class="mt-8 pt-5 border-t section-rule flex items-center justify-between gap-3 text-sm" aria-label="Pagination">
	{% if posts.has_previous %}
	<a href="?page={{ posts.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}" class="ui-button" rel="prev">← <span class="hidden sm:inline">Previous</span></a>
	{% else %}<span class="ui-button opacity-45" aria-disabled="true">← Previous</span>{% endif %}
	<span class="text-ink-500 dark:text-ink-400 font-mono text-xs" aria-label="Page {{ posts.number }} of {{ posts.paginator.num_pages }}">{{ posts.number }} / {{ posts.paginator.num_pages }}</span>
	{% if posts.has_next %}
	<a href="?page={{ posts.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}" class="ui-button" rel="next"><span class="hidden sm:inline">Next</span> →</a>
	{% else %}<span class="ui-button opacity-45" aria-disabled="true">Next →</span>{% endif %}
</nav>
{% endif %}
