<section class="workflow-panel" data-preview-root data-preview-url="{% url 'admin_post_preview_markdown' %}" data-summary-url="{% url 'admin_post_generate_summary' %}" data-tags-url="{% url 'admin_post_generate_tags' %}" data-preview-field="{{ preview_field }}" data-max-chars="100000">
	<header class="workflow-panel-header flex items-center justify-between gap-3"><div><h2 class="workflow-panel-title">{{ section_number }} · {{ section_title }}</h2><p class="workflow-panel-description">{{ section_description }}</p></div><button type="button" class="workflow-button !min-h-8" data-preview-refresh>刷新预览</button></header>
	<div class="workflow-panel-body"><div class="workflow-editor-grid"><div class="workflow-field"><label for="{{ field.id_for_label }}" class="workflow-label">{{ field.label }}{% if field.field.required %} <span class="workflow-required">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<p class="workflow-help">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="workflow-error">{{ error }}</p>{% endfor %}</div><div class="min-w-0"><div class="flex items-center justify-between gap-3 mb-2"><h3 class="workflow-panel-title">实时预览</h3><span class="workflow-help" aria-live="polite" data-preview-status>编辑后自动同步</span></div><div class="markdown-preview" data-preview-output>{{ preview_html|safe }}</div></div></div></div>
</section>
